name: release

on:
  push:
    tags: ["v*"]

# OIDC trusted-publishing requires id-token: write
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1 (OIDC token exchange on
      # `npm publish`). Node 22 LTS ships with npm 10.x by default, which
      # silently sends an unauth'd PUT and gets a misleading 404 back from
      # the registry. Explicitly upgrade.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish (OIDC trusted publisher — no token needed)
        run: npm publish --access public --provenance
