name: release

on:
  push:
    tags: ["v*"]

# OIDC trusted-publishing requires id-token: write
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24 LTS ships with npm 11.x natively. Trusted publishing
      # (OIDC token exchange on `npm publish`) requires npm >= 11.5.1.
      # Node 22 ships with npm 10.x, which:
      # 1) silently sends an unauth'd PUT and gets a misleading 404, and
      # 2) chokes on `npm install -g npm@latest` self-upgrades with
      #    "Cannot find module 'promise-retry'" on GHA prebuilt images.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish (OIDC trusted publisher — no token needed)
        run: npm publish --access public --provenance
